<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b1120" />
<meta name="color-scheme" content="dark" />
<title>Security News RSS Reader</title>
<style>
:root{--bg:#0b1120;--panel:#111827;--panel-2:#172033;--panel-3:#1f2937;--border:#2b374d;--text:#f8fafc;--muted:#94a3b8;--blue:#3b82f6;--blue-dark:#2563eb;--shadow:0 15px 40px rgba(0,0,0,.28)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-columns:270px minmax(0,1fr) 340px}
.sidebar,.details-panel{background:var(--panel);padding:20px;overflow-y:auto}
.sidebar{border-right:1px solid var(--border)}
.details-panel{border-left:1px solid var(--border)}
.main{min-width:0;padding:24px;overflow-y:auto}
.brand{font-size:21px;font-weight:800;margin-bottom:6px}
.subtitle{color:var(--muted);font-size:13px;margin-bottom:25px}
.section-title{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.1em;margin:22px 0 9px;text-transform:uppercase}
.feed-list{display:flex;flex-direction:column;gap:7px}
.feed-item{align-items:center;border:1px solid transparent;border-radius:8px;color:#cbd5e1;cursor:pointer;display:flex;gap:8px;padding:10px;user-select:none}
.feed-item:hover,.feed-item.active{background:var(--panel-2);border-color:var(--border);color:#fff}
.feed-item.dragging{opacity:.45}
.drag-handle{color:#64748b;cursor:grab}
.feed-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed-count{background:var(--panel-3);border-radius:20px;color:var(--muted);font-size:11px;padding:2px 7px}
.feed-actions{display:none;gap:3px}
.feed-item:hover .feed-actions{display:flex}
.icon-button{background:transparent;border:0;color:var(--muted);padding:3px}
.icon-button:hover{color:#fff}
.toolbar{align-items:center;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-bottom:22px}
.toolbar h1{font-size:28px;margin:0}
.toolbar p{color:var(--muted);font-size:13px;margin:5px 0 0}
.toolbar-left{flex:1;min-width:220px}
.toolbar-controls{align-items:center;display:flex;flex-wrap:wrap;gap:8px}
input,select{background:var(--panel);border:1px solid var(--border);border-radius:7px;color:#fff;outline:none;padding:10px 11px;width:100%}
input:focus,select:focus{border-color:var(--blue)}
.search{max-width:300px}
.button{background:var(--panel-3);border:1px solid var(--border);border-radius:7px;color:#fff;display:inline-block;padding:9px 12px;text-decoration:none}
.button:hover{background:#29364b}
.button.primary{background:var(--blue-dark);border-color:var(--blue)}
.button.primary:hover{background:var(--blue)}
.button.danger{color:#fecaca}
.button.small{font-size:12px;padding:6px 8px}
.articles{display:flex;flex-direction:column;gap:12px;max-width:1000px}
.article{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:17px;transition:border-color .15s,transform .15s}
.article:hover{border-color:#475569;transform:translateY(-1px)}
.article.unread{border-left:3px solid var(--blue)}
.article.pinned{border-color:#927c1f}
.article-top{align-items:center;color:var(--muted);display:flex;font-size:12px;gap:9px;justify-content:space-between;margin-bottom:9px}
.article-source{color:#93c5fd;font-weight:700}
.article-title{cursor:pointer;font-size:18px;font-weight:750;line-height:1.35;margin:0 0 8px}
.article-title:hover{color:#93c5fd}
.article-description{color:#cbd5e1;font-size:14px;line-height:1.55;margin:0 0 13px}
.article-bottom{align-items:center;display:flex;flex-wrap:wrap;gap:7px;justify-content:space-between}
.article-date{color:var(--muted);font-size:12px}
.article-buttons{display:flex;flex-wrap:wrap;gap:6px}
.empty{border:1px dashed var(--border);border-radius:10px;color:var(--muted);padding:40px 20px;text-align:center}
.status{color:var(--muted);font-size:12px;margin-top:12px;min-height:18px}
.details-empty{color:var(--muted);line-height:1.6;margin-top:30px}
.details-panel h2{font-size:18px;margin:0 0 18px}
.detail-title{font-size:22px;line-height:1.35;margin:12px 0}
.detail-description{color:#cbd5e1;line-height:1.6}
.detail-meta{color:var(--muted);font-size:13px;line-height:1.7}
.reader{display:none;max-width:760px}
.reader.open{display:block}
body.reading .toolbar,body.reading .articles{display:none}
.reader-nav{display:flex;gap:8px;margin-bottom:18px}
.reader h1{font-size:30px;line-height:1.25;margin:0 0 10px}
.reader-meta{color:var(--muted);font-size:13px;margin-bottom:22px}
.reader-note{color:var(--muted)}
.reader-body{color:#e2e8f0;font-size:17px;line-height:1.75;overflow-wrap:anywhere}
.reader-body a{color:#93c5fd}
.reader-body h2,.reader-body h3{margin-top:1.6em}
.reader-body pre{background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow-x:auto;padding:12px}
.reader-body blockquote{border-left:3px solid var(--border);color:var(--muted);margin:16px 0;padding-left:14px}
.reader-body table{border-collapse:collapse;display:block;overflow-x:auto}
.reader-body td,.reader-body th{border:1px solid var(--border);padding:6px 9px}
.modal-backdrop{align-items:center;background:rgba(0,0,0,.72);display:none;inset:0;justify-content:center;padding:20px;position:fixed;z-index:10}
.modal-backdrop.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);max-width:570px;padding:23px;width:100%}
.modal-header{align-items:center;display:flex;justify-content:space-between;margin-bottom:18px}
.modal-header h2{font-size:20px;margin:0}
.form-group{margin-bottom:14px}
.form-group label{color:#cbd5e1;display:block;font-size:13px;margin-bottom:6px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
@media(max-width:1100px){.app{grid-template-columns:230px minmax(0,1fr)}.details-panel{display:none}}
@media(max-width:720px){.app{display:block}.sidebar{border-bottom:1px solid var(--border);border-right:0;padding:15px}.brand{margin-bottom:2px}.feed-list{flex-direction:row;overflow-x:auto;padding-bottom:3px}.feed-item{flex:0 0 auto}.feed-actions,.drag-handle{display:none!important}.main{padding:17px}.toolbar{display:block}.toolbar-controls{margin-top:15px}.search{max-width:none}.toolbar h1{font-size:24px}.reader h1{font-size:24px}}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{-webkit-tap-highlight-color:transparent;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#addFeedButton{width:100%}
.manage-button,.move-feed{display:none}
.reader-nav{background:var(--bg);margin:0 0 14px;padding:10px 0;position:sticky;top:0;z-index:3}
.article-description[data-action]{cursor:pointer}
.status:empty{display:none}
@media(hover:none){.article:hover{border-color:var(--border);transform:none}}
@media(pointer:coarse){.button,.icon-button{min-height:40px}.button.small{min-height:38px}}
@media(max-width:720px){
input,select{font-size:16px}
.hide-sm,.subtitle,.section-title{display:none}
.sidebar{align-items:center;display:flex;flex-wrap:wrap;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 14px 12px}
.brand{flex:1;font-size:19px;margin:0}
#addFeedButton{width:auto}
.manage-button{display:inline-block}
.feed-list{flex:0 0 100%;gap:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.feed-list::-webkit-scrollbar{display:none}
.feed-item{border-color:var(--border);border-radius:20px;padding:8px 13px;white-space:nowrap}
.feed-name{flex:none}
body.manage .feed-actions{display:flex!important}
body.manage .move-feed{display:inline-block}
.status{flex:0 0 100%;margin:0}
body.reading .sidebar{display:none}
.main{padding:14px}
.toolbar{margin-bottom:14px}
.toolbar h1{font-size:22px}
.toolbar-controls{display:grid;gap:8px;grid-template-columns:1fr auto auto;margin-top:12px}
.search{grid-column:1/-1;max-width:none}
.article{padding:14px}
.article-title{font-size:17px}
.article-top{align-items:flex-start;flex-direction:column;gap:3px}
.article-bottom{align-items:stretch;flex-direction:column}
.article-buttons{display:grid;grid-template-columns:repeat(4,1fr)}
.article-buttons .button{padding:8px 4px;text-align:center}
.reader-nav{padding-top:calc(10px + env(safe-area-inset-top))}
.reader-body{font-size:18px;line-height:1.7}
.modal-backdrop{align-items:flex-end;padding:0}
.modal{border-radius:14px 14px 0 0;max-height:92vh;overflow-y:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="brand">Security Reader</div>
<div class="subtitle">Security and technology news</div>
<button class="button primary" id="addFeedButton">+ Add<span class="hide-sm"> website</span></button>
<button class="button manage-button" id="manageButton">Edit</button>
<div class="section-title">Websites</div>
<div class="feed-list" id="feedList"></div>
<div class="status" id="status"></div>
</aside>

<main class="main">
<div class="toolbar">
<div class="toolbar-left">
<h1 id="pageTitle">All articles</h1>
<p id="articleSummary">Loading articles…</p>
</div>
<div class="toolbar-controls">
<input class="search" id="searchInput" type="search" placeholder="Search articles..." />
<select id="sortSelect">
<option value="newest">Newest first</option>
<option value="oldest">Oldest first</option>
<option value="source">Website order</option>
</select>
<button class="button" id="unreadButton">Unread only</button>
<button class="button primary" id="refreshButton">Refresh</button>
</div>
</div>
<section class="articles" id="articles"></section>
<section class="reader" id="reader"></section>
</main>

<aside class="details-panel">
<h2>Article details</h2>
<div id="details"></div>
</aside>
</div>

<div class="modal-backdrop" id="feedModal">
<div class="modal">
<div class="modal-header">
<h2 id="modalTitle">Add website</h2>
<button class="icon-button" id="closeModalButton">✕</button>
</div>
<form id="feedForm">
<input type="hidden" id="editingFeedId" />
<div class="form-group">
<label for="feedName">Website name</label>
<input id="feedName" required placeholder="Example Security Blog" />
</div>
<div class="form-group">
<label for="feedUrl">RSS or Atom feed URL</label>
<input id="feedUrl" type="url" required placeholder="https://example.com/feed.xml" />
</div>
<div class="form-group">
<label for="siteUrl">Website URL</label>
<input id="siteUrl" type="url" placeholder="https://example.com" />
</div>
<div class="modal-actions">
<button type="button" class="button" id="cancelModalButton">Cancel</button>
<button type="submit" class="button primary">Save website</button>
</div>
</form>
</div>
</div>

<script>
const KEYS = {
feeds: "security-reader-feeds",
articles: "security-reader-articles",
settings: "security-reader-settings"
};
const $ = id => document.getElementById(id);

function load(key, fallback) {
try {
const value = localStorage.getItem(key);
return value ? JSON.parse(value) : fallback;
} catch {
return fallback;
}
}

function save(key, value) {
try {
localStorage.setItem(key, JSON.stringify(value));
} catch {
// Storage full: drop cached article bodies and retry
if (key === KEYS.articles) {
value.forEach(a => { delete a.fullContent; delete a.content; });
try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}
}
}

// crypto.randomUUID only exists on HTTPS/localhost pages, so fall back when it's missing
const uuid = () =>
globalThis.crypto?.randomUUID?.() ||
"id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);

const newFeed = (name, url, siteUrl, position) =>
({ id: uuid(), name, url, siteUrl, enabled: true, position });

let feeds = load(KEYS.feeds, null);
if (!feeds) {
feeds = [
newFeed("BleepingComputer", "https://www.bleepingcomputer.com/feed/", "https://www.bleepingcomputer.com/", 0),
newFeed("Dark Reading", "https://www.darkreading.com/rss.xml", "https://www.darkreading.com/", 1),
newFeed("Ars Technica", "https://feeds.arstechnica.com/arstechnica/index", "https://arstechnica.com/", 2),
newFeed("404 Media", "https://www.404media.co/rss/", "https://www.404media.co/", 3),
newFeed("KrebsOnSecurity", "https://krebsonsecurity.com/feed/", "https://krebsonsecurity.com/", 4),
newFeed("Schneier Security", "https://www.schneier.com/feed/atom", "https://www.schneier.com/", 5),
    newFeed("Wired Security", "hhttps://www.wired.com/feed/category/security/latest/rss", "https://www.wired.com/", 6),
    newFeed("Wired Security", "https://www.wired.com/feed/category/security/latest/rss", "https://www.wired.com/", 6),
newFeed("Security Week", "https://www.securityweek.com/feed", "https://www.securityweek.com/", 7)
];
save(KEYS.feeds, feeds);
}

let articles = load(KEYS.articles, []);
let settings = load(KEYS.settings, { selectedFeed: "all", unreadOnly: false, sort: "newest", search: "" });
let selectedArticleId = null;
let draggedFeedId = null;

const feedList = $("feedList"), articlesContainer = $("articles"), detailsContainer = $("details"),
statusElement = $("status"), pageTitle = $("pageTitle"), articleSummary = $("articleSummary"),
searchInput = $("searchInput"), sortSelect = $("sortSelect"), unreadButton = $("unreadButton"),
refreshButton = $("refreshButton"), feedModal = $("feedModal"), feedForm = $("feedForm"),
reader = $("reader");

searchInput.value = settings.search;
sortSelect.value = settings.sort;

/* ---------- Helpers ---------- */

function escapeHtml(value = "") {
return String(value).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
.replaceAll('"', "&quot;").replaceAll("'", "&#039;");
}

// DOMParser is inert, so nothing inside the HTML (e.g. images) is downloaded
function stripHtml(value = "") {
return new DOMParser().parseFromString(value, "text/html").body.textContent || "";
}

function formatDate(value) {
const date = new Date(value);
if (!value || Number.isNaN(date.getTime())) return "Unknown date";
return new Intl.DateTimeFormat(undefined, { dateStyle: "medium", timeStyle: "short" }).format(date);
}

const getFeed = id => feeds.find(f => f.id === id);
const getFeedName = id => getFeed(id)?.name || "Unknown website";

function setStatus(message, isError = false) {
statusElement.textContent = message;
statusElement.style.color = isError ? "#fca5a5" : "var(--muted)";
}

/* ---------- Rendering ---------- */

function renderFeeds() {
const unread = id => articles.filter(a => !a.read && !a.hidden && (!id || a.feedId === id)).length;

feedList.innerHTML =
`<div class="feed-item ${settings.selectedFeed === "all" ? "active" : ""}" data-feed-id="all">
     <span class="feed-name">★ All articles</span><span class="feed-count">${unread()}</span></div>` +
[...feeds].sort((a, b) => a.position - b.position).map(f => `
     <div class="feed-item ${settings.selectedFeed === f.id ? "active" : ""}" draggable="true" data-feed-id="${f.id}">
       <span class="drag-handle" title="Drag to reorder">☷</span>
       <span class="feed-name">${escapeHtml(f.name)}</span>
       <span class="feed-count">${unread(f.id)}</span>
       <span class="feed-actions">
         <button class="icon-button move-feed" data-dir="-1" title="Move left">‹</button>
         <button class="icon-button move-feed" data-dir="1" title="Move right">›</button>
         <button class="icon-button edit-feed" title="Edit">✎</button>
         <button class="icon-button delete-feed" title="Delete">×</button>
       </span>
     </div>`).join("");
}

function moveFeed(id, dir) {
const sorted = [...feeds].sort((a, b) => a.position - b.position);
const i = sorted.findIndex(f => f.id === id), j = i + dir;
if (i < 0 || j < 0 || j >= sorted.length) return;
[sorted[i].position, sorted[j].position] = [sorted[j].position, sorted[i].position];
save(KEYS.feeds, feeds);
render();
}

function filteredArticles() {
const search = settings.search.trim().toLowerCase();

const result = articles.filter(a => {
if (a.hidden) return false;
if (settings.selectedFeed !== "all" && a.feedId !== settings.selectedFeed) return false;
if (settings.unreadOnly && a.read) return false;
return !search ||
[a.title, a.description, getFeedName(a.feedId)].join(" ").toLowerCase().includes(search);
});

const time = a => new Date(a.publishedAt || 0);

if (settings.sort === "oldest") {
result.sort((a, b) => time(a) - time(b));
} else if (settings.sort === "source") {
result.sort((a, b) => {
const pa = getFeed(a.feedId)?.position ?? 999, pb = getFeed(b.feedId)?.position ?? 999;
return pa !== pb ? pa - pb : time(b) - time(a);
});
} else {
result.sort((a, b) => (a.pinned !== b.pinned ? (a.pinned ? -1 : 1) : time(b) - time(a)));
}
return result;
}

function renderArticles() {
const visible = filteredArticles();
const selectedFeed = settings.selectedFeed === "all" ? null : getFeed(settings.selectedFeed);

pageTitle.textContent = selectedFeed ? selectedFeed.name : "All articles";
articleSummary.textContent = `${visible.length} article${visible.length === 1 ? "" : "s"} displayed`;

if (!visible.length) {
articlesContainer.innerHTML =
`<div class="empty">No articles match the current filters.<br /><br />Try refreshing the feeds or changing your filters.</div>`;
return;
}

articlesContainer.innerHTML = visible.map(a => {
const text = stripHtml(a.description || "");
const id = escapeHtml(a.id);
return `
     <article class="article ${a.read ? "" : "unread"} ${a.pinned ? "pinned" : ""}">
       <div class="article-top">
         <span class="article-source">${escapeHtml(getFeedName(a.feedId))}</span>
         <span>${a.pinned ? "★ Pinned · " : ""}${formatDate(a.publishedAt)}</span>
       </div>
       <h2 class="article-title" data-action="open" data-id="${id}">${escapeHtml(a.title)}</h2>
       <p class="article-description" data-action="open" data-id="${id}">${escapeHtml(text.length > 280 ? text.slice(0, 280) + "…" : text)}</p>
       <div class="article-bottom">
         <span class="article-date">${a.author ? escapeHtml(a.author) : ""}</span>
         <div class="article-buttons">
           <button class="button small" data-action="open" data-id="${id}">Read</button>
           <button class="button small" data-action="pin" data-id="${id}">${a.pinned ? "Unpin" : "Pin"}</button>
           <button class="button small" data-action="read" data-id="${id}">${a.read ? "Unread" : "Mark read"}</button>
           <button class="button small danger" data-action="hide" data-id="${id}">Hide</button>
         </div>
       </div>
     </article>`;
}).join("");
}

function renderDetails() {
const a = articles.find(item => item.id === selectedArticleId);

if (!a) {
detailsContainer.innerHTML = `<div class="details-empty">Select an article to view its details here.</div>`;
return;
}

detailsContainer.innerHTML = `
   <div class="detail-meta">${escapeHtml(getFeedName(a.feedId))}<br />${formatDate(a.publishedAt)}
     ${a.author ? `<br />${escapeHtml(a.author)}` : ""}</div>
   <h3 class="detail-title">${escapeHtml(a.title)}</h3>
   <p class="detail-description">${escapeHtml(stripHtml(a.description || "No description available."))}</p>
   <br />
   <a class="button primary" href="${escapeHtml(absUrl(a.url) || "#")}" target="_blank" rel="noopener noreferrer">Open original article</a>`;
}

function render() {
renderFeeds();
renderArticles();
renderDetails();
unreadButton.textContent = settings.unreadOnly ? "Showing unread" : "Unread only";
}

/* ---------- Networking ---------- */

const PROXIES = [
u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
u => "https://corsproxy.io/?" + encodeURIComponent(u),
u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u)
];

// Starts with the first proxy; backups only start if it is slow or failing (1s and 2s later)
function fetchText(url, timeout = 8000) {
let settled = false;
return Promise.any(PROXIES.map(async (makeUrl, i) => {
if (i) await new Promise(r => setTimeout(r, i * 1000));
if (settled) throw new Error("Skipped");
const controller = new AbortController();
const timer = setTimeout(() => controller.abort(), timeout);
try {
const res = await fetch(makeUrl(url), { signal: controller.signal });
if (!res.ok) throw new Error(res.status);
const text = await res.text();
if (!text.trim()) throw new Error("Empty response");
settled = true;
return text;
} finally {
clearTimeout(timer);
}
}));
}

async function fetchFeed(feed) {
let xmlText;

try {
xmlText = await fetchText(feed.url);
} catch {
throw new Error(`Could not load ${feed.name}`);
}

const xml = new DOMParser().parseFromString(xmlText, "text/xml");
  if (xml.querySelector("parsererror")) throw new Error(`Invalid RSS response from ${feed.name}`);

  const tag = (item, name) => item.getElementsByTagName(name)[0]?.textContent?.trim() || "";
  if (xml.querySelector("parsererror")) {
    throw new Error(`Invalid RSS or Atom response from ${feed.name}`);
  }

  const firstText = (element, selectors) => {
    for (const selector of selectors) {
      const found = element.querySelector(selector);
      const value = found?.textContent?.trim();
      if (value) return value;
    }
    return "";
  };

  const getArticleLink = item => {
    // Prefer Atom's normal article link over self/enclosure links.
    const alternate = [...item.querySelectorAll("link[href]")]
      .find(link => !link.getAttribute("rel") || link.getAttribute("rel") === "alternate");

    if (alternate) {
      return alternate.getAttribute("href") || "";
    }

    const textLink = item.querySelector("link")?.textContent?.trim();
    return textLink || "";
  };

  const getAuthor = item => {
    return firstText(item, [
      "author > name",
      "author",
      "creator",
      "dc\\:creator"
    ]);
  };

  const entries = [...xml.querySelectorAll("item, entry")];

  return entries.map((item, index) => {
    const link = getArticleLink(item);

  return [...xml.querySelectorAll("item, entry")].map((item, index) => {
    const linkEl = item.querySelector("link[href]") || item.getElementsByTagName("link")[0];
    const link = linkEl?.getAttribute("href") || linkEl?.textContent?.trim() || "";
    const raw = tag(item, "description") || tag(item, "summary") || tag(item, "content");
    const guid = tag(item, "guid") || tag(item, "id") || link || `${feed.id}-${index}`;
    const rawContent = firstText(item, [
      "content\\:encoded",
      "content",
      "description",
      "summary"
    ]);

    const guid = firstText(item, [
      "guid",
      "id"
    ]) || link || `${feed.id}-${index}`;

    const title = firstText(item, ["title"]);

return {
      id: `${feed.id}-${btoa(unescape(encodeURIComponent(guid))).replaceAll("/", "_").replaceAll("=", "").slice(0, 80)}`,
      id: `${feed.id}-${btoa(unescape(encodeURIComponent(guid)))
        .replaceAll("/", "_")
        .replaceAll("=", "")
        .slice(0, 80)}`,

guid,
feedId: feed.id,
      title: tag(item, "title"),
      title,
url: absUrl(link, feed.url),
      description: stripHtml(raw).slice(0, 400),
      content: tag(item, "content:encoded") || tag(item, "content") || raw,
      author: tag(item, "dc:creator") || tag(item, "author"),
      publishedAt: tag(item, "pubDate") || tag(item, "published") || tag(item, "updated") || new Date().toISOString(),
      description: stripHtml(rawContent).slice(0, 400),
      content: rawContent,
      author: getAuthor(item),

      publishedAt: firstText(item, [
        "pubDate",
        "published",
        "updated",
        "date",
        "dc\\:date"
      ]) || new Date().toISOString(),

read: false,
pinned: false,
hidden: false
};
  }).filter(a => a.title && a.url);
  }).filter(article => article.title && article.url);
}

function mergeArticles(incoming) {
const index = new Map();
articles.forEach(a => {
index.set(a.feedId + "|" + a.guid, a);
index.set(a.feedId + "|" + a.url, a);
});

for (const inc of incoming) {
const existing = index.get(inc.feedId + "|" + inc.guid) || index.get(inc.feedId + "|" + inc.url);
if (existing) {
Object.assign(existing, {
title: inc.title, description: inc.description, content: inc.content,
author: inc.author, publishedAt: inc.publishedAt, url: inc.url
});
} else {
articles.push(inc);
}
}
}

function pruneArticles(perFeed = 60) {
const counts = {};
articles.sort((a, b) => new Date(b.publishedAt || 0) - new Date(a.publishedAt || 0));
articles = articles.filter(a => a.pinned || (counts[a.feedId] = (counts[a.feedId] || 0) + 1) <= perFeed);
}

async function refreshFeeds() {
const enabled = feeds.filter(f => f.enabled);

if (!enabled.length) {
setStatus("No enabled websites.", true);
return;
}

refreshButton.disabled = true;
refreshButton.textContent = "Refreshing…";
setStatus(`Loaded 0 of ${enabled.length}…`);

let done = 0;
const failedNames = [];

// All feeds load in parallel; each appears as soon as it arrives
await Promise.all(enabled.map(async feed => {
try {
mergeArticles(await fetchFeed(feed));
render();
} catch (error) {
console.warn(error.message);
failedNames.push(feed.name);
}
setStatus(`Loaded ${++done} of ${enabled.length}…`);
}));

pruneArticles();
save(KEYS.articles, articles);
settings.lastRefresh = Date.now();
save(KEYS.settings, settings);

refreshButton.disabled = false;
refreshButton.textContent = "Refresh";
const failed = failedNames.length;
setStatus(failed
? `${enabled.length - failed} loaded, ${failed} failed: ${failedNames.join(", ")}.`
: `${enabled.length} website${enabled.length === 1 ? "" : "s"} loaded.`);
render();
}

/* ---------- In-app reader (text only, no images) ---------- */

const ALLOWED_TAGS = new Set(
"P BR A UL OL LI H1 H2 H3 H4 H5 H6 BLOCKQUOTE PRE CODE EM STRONG B I TABLE THEAD TBODY TR TH TD HR SPAN DIV SUB SUP".split(" ")
);

function absUrl(value, base) {
try {
const url = new URL(value, base);
return /^https?:$/.test(url.protocol) ? url.href : "";
} catch {
return "";
}
}

// Allow-list sanitizer: keeps basic formatting only. Images, media, scripts and styles are removed.
function sanitize(html, baseUrl) {
const doc = new DOMParser().parseFromString(html, "text/html");
doc.querySelectorAll(
"script,style,iframe,object,embed,form,noscript,nav,footer,aside,svg,button,input,select,textarea,img,picture,source,figure,video,audio,canvas"
).forEach(n => n.remove());

doc.body.querySelectorAll("*").forEach(el => {
if (!ALLOWED_TAGS.has(el.tagName)) return el.replaceWith(...el.childNodes);

const href = el.tagName === "A" ? absUrl(el.getAttribute("href") || "", baseUrl) : "";
[...el.attributes].forEach(attr => el.removeAttribute(attr.name));

if (el.tagName === "A") {
if (!href) return el.replaceWith(...el.childNodes);
el.href = href;
el.target = "_blank";
el.rel = "noopener noreferrer";
}
});

return doc.body.innerHTML;
}

// Picks the block of the page that holds the most paragraph text
function extractArticle(html, url) {
const doc = new DOMParser().parseFromString(html, "text/html");
const score = el => [...el.querySelectorAll("p")].reduce((n, p) => n + p.textContent.length, 0);
let best = doc.body, bestScore = 0;

doc.querySelectorAll("article, [itemprop='articleBody'], .entry-content, .post-content, .article-body, main")
.forEach(el => {
const s = score(el);
if (s > 0 && s >= bestScore) { best = el; bestScore = s; }
});

return sanitize(best.innerHTML, url);
}

let listScroll = 0;

async function openReader(id) {
const a = articles.find(item => item.id === id);
if (!a) return;

listScroll = window.scrollY;
try { if (!history.state?.reader) history.pushState({ reader: 1 }, ""); } catch {}

a.read = true;
selectedArticleId = id;
save(KEYS.articles, articles);

reader.innerHTML = `
   <div class="reader-nav">
     <button class="button" id="readerBack">← Back</button>
     <a class="button" href="${escapeHtml(absUrl(a.url) || "#")}" target="_blank" rel="noopener noreferrer">Original ↗</a>
   </div>
   <h1>${escapeHtml(a.title)}</h1>
   <div class="reader-meta">${escapeHtml(getFeedName(a.feedId))} · ${formatDate(a.publishedAt)}${a.author ? " · " + escapeHtml(a.author) : ""}</div>
   <div class="reader-body" id="readerBody"><p class="reader-note">Loading article…</p></div>`;
reader.classList.add("open");
document.body.classList.add("reading");
window.scrollTo(0, 0);
document.querySelector(".main").scrollTop = 0;
$("readerBack").addEventListener("click", backFromReader);
render();

const body = $("readerBody");
const textLength = html => stripHtml(html || "").length;
let html = "", note = "";

try {
if (textLength(a.content) >= 800) {
html = sanitize(a.content, a.url);                      // feed already contains the full text
} else if (a.fullContent) {
html = sanitize(a.fullContent, a.url);                  // fetched earlier
} else {
html = extractArticle(await fetchText(a.url, 12000), a.url);
if (textLength(html) < 200) throw new Error("Not enough text");
a.fullContent = html;
save(KEYS.articles, articles);
}
} catch (error) {
console.error(error);
html = sanitize(a.content || a.description || "", a.url);
note = `<p class="reader-note">The full text couldn't be loaded, so this is the feed's summary.</p>`;
}

if (body.isConnected) body.innerHTML = note + (html || "<p>No content available.</p>");
}

function closeReader() {
const wasOpen = reader.classList.contains("open");
document.body.classList.remove("reading");
reader.classList.remove("open");
reader.innerHTML = "";
if (wasOpen) window.scrollTo(0, listScroll);
}

// Goes through browser history so the phone's back button/swipe closes the reader
function backFromReader() {
if (history.state?.reader) history.back();
else closeReader();
}

window.addEventListener("popstate", closeReader);

/* ---------- Feed modal ---------- */

function openFeedModal(feedId = null) {
const feed = feedId ? getFeed(feedId) : null;
feedModal.classList.add("open");
$("modalTitle").textContent = feed ? "Edit website" : "Add website";
$("editingFeedId").value = feed?.id || "";
$("feedName").value = feed?.name || "";
$("feedUrl").value = feed?.url || "";
$("siteUrl").value = feed?.siteUrl || "";
$("feedName").focus();
}

function closeFeedModal() {
feedModal.classList.remove("open");
feedForm.reset();
$("editingFeedId").value = "";
}

feedForm.addEventListener("submit", event => {
event.preventDefault();

const editingId = $("editingFeedId").value;
const name = $("feedName").value.trim();
const url = $("feedUrl").value.trim();
const siteUrl = $("siteUrl").value.trim();

if (editingId) {
const feed = getFeed(editingId);
if (feed) Object.assign(feed, { name, url, siteUrl });
} else {
const next = feeds.reduce((max, f) => Math.max(max, f.position), -1) + 1;
feeds.push({ id: uuid(), name, url, siteUrl, enabled: true, position: next });
}

save(KEYS.feeds, feeds);
closeFeedModal();
render();
});

/* ---------- Events ---------- */

feedList.addEventListener("click", event => {
const item = event.target.closest(".feed-item");
if (!item) return;
const id = item.dataset.feedId;

const mover = event.target.closest(".move-feed");
if (mover) return moveFeed(id, Number(mover.dataset.dir));

if (event.target.closest(".edit-feed")) return openFeedModal(id);

if (event.target.closest(".delete-feed")) {
const feed = getFeed(id);
if (!feed || !confirm(`Remove ${feed.name} and its saved articles?`)) return;

feeds = feeds.filter(f => f.id !== id);
articles = articles.filter(a => a.feedId !== id);
if (settings.selectedFeed === id) settings.selectedFeed = "all";

save(KEYS.feeds, feeds);
save(KEYS.articles, articles);
save(KEYS.settings, settings);
return render();
}

settings.selectedFeed = id;
save(KEYS.settings, settings);
listScroll = 0;
backFromReader();
render();
});

feedList.addEventListener("dragstart", event => {
const item = event.target.closest(".feed-item");
if (!item) return;
draggedFeedId = item.dataset.feedId;
item.classList.add("dragging");
});

feedList.addEventListener("dragend", event => {
event.target.closest?.(".feed-item")?.classList.remove("dragging");
});

feedList.addEventListener("dragover", event => event.preventDefault());

feedList.addEventListener("drop", event => {
event.preventDefault();
const item = event.target.closest(".feed-item");
if (!item || !draggedFeedId) return;

const targetId = item.dataset.feedId;
if (targetId === "all" || targetId === draggedFeedId) return;

const dragged = getFeed(draggedFeedId), target = getFeed(targetId);
if (!dragged || !target) return;

[dragged.position, target.position] = [target.position, dragged.position];
save(KEYS.feeds, feeds);
render();
});

articlesContainer.addEventListener("click", event => {
const el = event.target.closest("[data-action]");
if (!el) return;

const a = articles.find(item => item.id === el.dataset.id);
if (!a) return;

const action = el.dataset.action;
if (action === "open") return openReader(a.id);

if (action === "pin") a.pinned = !a.pinned;
if (action === "read") a.read = !a.read;
if (action === "hide") a.hidden = true;

save(KEYS.articles, articles);
render();
});

$("addFeedButton").addEventListener("click", () => openFeedModal());
$("closeModalButton").addEventListener("click", closeFeedModal);
$("cancelModalButton").addEventListener("click", closeFeedModal);
feedModal.addEventListener("click", event => { if (event.target === feedModal) closeFeedModal(); });
refreshButton.addEventListener("click", refreshFeeds);

unreadButton.addEventListener("click", () => {
settings.unreadOnly = !settings.unreadOnly;
save(KEYS.settings, settings);
render();
});

sortSelect.addEventListener("change", event => {
settings.sort = event.target.value;
save(KEYS.settings, settings);
render();
});

let searchTimer;
searchInput.addEventListener("input", event => {
settings.search = event.target.value;
clearTimeout(searchTimer);
searchTimer = setTimeout(() => { save(KEYS.settings, settings); render(); }, 150);
});

$("manageButton").addEventListener("click", event => {
event.target.textContent = document.body.classList.toggle("manage") ? "Done" : "Edit";
});

// Phones keep the page alive in the background, so refresh when you come back after a while
document.addEventListener("visibilitychange", () => {
if (!document.hidden && !refreshButton.disabled && Date.now() - (settings.lastRefresh || 0) > 15 * 60 * 1000) {
refreshFeeds();
}
});

document.addEventListener("keydown", event => {
if (event.key === "Escape") { backFromReader(); closeFeedModal(); }
});

/* ---------- Start ---------- */

render(); // saved articles appear instantly

// Then refresh in the background if the saved articles are over 15 minutes old
if (!articles.length || Date.now() - (settings.lastRefresh || 0) > 15 * 60 * 1000) {
refreshFeeds();
}
</script>
</body>
